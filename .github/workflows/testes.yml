# Vistoria automática: roda lint e a suíte de testes a cada push e pull
# request. Os testes são 100% offline (Supabase, embeddings e LLM são
# substituídos por dublês em tests/apoio/), então nenhum segredo é necessário.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        # Somente compilação: nenhum segredo ou banco real é usado no CI.
        # Este build não é publicado; a Vercel usa suas próprias variáveis.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-publica-sem-acesso-para-build
          SUPABASE_SERVICE_ROLE_KEY: chave-sem-acesso-para-build
        run: npm run build
